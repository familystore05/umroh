<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UmrohPro Management - Cloud Version</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        [x-cloak] { display: none !important; }
        .tab-active { background-color: #4f46e5; color: white; box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3); }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body x-data="appData()" x-init="init()" class="antialiased text-slate-900">

    <template x-if="!isLoggedIn">
        <div class="min-h-screen flex items-center justify-center bg-slate-950 p-6">
            <div class="bg-white p-8 rounded-[2rem] w-full max-w-md shadow-2xl">
                <h1 class="text-2xl font-black text-center mb-8">Umroh<span class="text-indigo-600">Pro</span></h1>
                <form @submit.prevent="login()" class="space-y-4">
                    <input type="text" x-model="loginForm.user" placeholder="Username" class="w-full p-4 bg-slate-50 border rounded-xl outline-none font-bold">
                    <input type="password" x-model="loginForm.pass" placeholder="Password" class="w-full p-4 bg-slate-50 border rounded-xl outline-none font-bold">
                    <button type="submit" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-black uppercase text-xs">Login</button>
                </form>
            </div>
        </div>
    </template>

    <template x-if="isLoggedIn">
        <div class="min-h-screen flex flex-col">
            <header class="bg-white border-b border-slate-200 p-4 md:p-6 flex flex-col md:flex-row justify-between items-center sticky top-0 z-50 gap-4">
                <div class="flex items-center justify-between w-full md:w-auto gap-4">
                    <h2 class="font-black text-xl tracking-tighter">Umroh<span class="text-indigo-600">Pro</span></h2>
                    <nav class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl">
                        <button @click="activeTab = 'jamaah'" :class="activeTab === 'jamaah' ? 'tab-active' : 'text-slate-500'" class="px-4 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest transition-all">Jamaah</button>
                        <button @click="activeTab = 'kas'" :class="activeTab === 'kas' ? 'tab-active' : 'text-slate-500'" class="px-4 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest transition-all">Kas & Zakat</button>
                    </nav>
                </div>
                <button @click="logout()" class="text-rose-600 font-black text-[10px] uppercase tracking-widest px-4 py-2 rounded-xl border">Keluar</button>
            </header>

            <main class="max-w-7xl mx-auto w-full p-4 md:p-6 flex-1">
                
                <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8">
                    <div class="bg-white p-5 rounded-3xl border shadow-sm">
                        <p class="text-[9px] font-black text-slate-400 uppercase">Total Jamaah</p>
                        <h3 class="text-lg font-black text-indigo-600" x-text="filteredJamaah().reduce((s, i) => s + i.pax, 0) + ' Pax'"></h3>
                    </div>
                    <div class="bg-white p-5 rounded-3xl border shadow-sm">
                        <p class="text-[9px] font-black text-slate-400 uppercase">Komisi Dibayar</p>
                        <h3 class="text-lg font-black text-emerald-600" x-text="formatIDR(komisiDibayar())"></h3>
                    </div>
                    <div class="bg-white p-5 rounded-3xl border shadow-sm">
                        <p class="text-[9px] font-black text-slate-400 uppercase">Komisi Pending</p>
                        <h3 class="text-lg font-black text-amber-500" x-text="formatIDR(komisiPending())"></h3>
                    </div>
                    <div class="bg-amber-500 p-5 rounded-3xl text-white shadow-lg">
                        <p class="text-[9px] font-black uppercase opacity-80">Sisa Zakat</p>
                        <h3 class="text-lg font-black" x-text="formatIDR(wajibZakat() - zakatTerbayar())"></h3>
                    </div>
                    <div class="bg-slate-900 p-5 rounded-3xl text-white">
                        <p class="text-[9px] font-black uppercase opacity-80">Laba Bersih</p>
                        <h3 class="text-lg font-black text-emerald-400" x-text="formatIDR(labaBersih())"></h3>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-3xl border shadow-sm flex flex-wrap items-center gap-4 mb-6">
                    <div class="flex items-center gap-2 bg-slate-50 px-3 py-2 rounded-xl border w-full md:w-auto">
                        <span class="text-[10px] font-black text-slate-400 uppercase">Periode:</span>
                        <select x-model="filters.time" @change="currentPageJ = 1" class="bg-transparent text-xs font-black outline-none w-full">
                            <option value="all">Semua Waktu</option>
                            <option value="today">Hari Ini</option>
                            <option value="month">Bulan Ini</option>
                            <option value="year">Tahun Ini</option>
                            <option value="custom">Rentang Custom</option>
                        </select>
                    </div>

                    <div class="flex items-center gap-2 bg-slate-50 px-3 py-2 rounded-xl border w-full md:w-auto">
                        <span class="text-[10px] font-black text-slate-400 uppercase">Status Komisi:</span>
                        <select x-model="filters.status" @change="currentPageJ = 1" class="bg-transparent text-xs font-black outline-none w-full">
                            <option value="all">Semua Status</option>
                            <option value="Dibayar">Sudah Cair</option>
                            <option value="Pending">Belum Cair (Pending)</option>
                        </select>
                    </div>

                    <template x-if="filters.time === 'custom'">
                        <div class="flex items-center gap-2">
                            <input type="date" x-model="filters.start" class="bg-white border p-2 rounded-xl text-xs font-bold">
                            <input type="date" x-model="filters.end" class="bg-white border p-2 rounded-xl text-xs font-bold">
                        </div>
                    </template>

                    <div class="flex items-center gap-2 ml-auto">
                        <button @click="exportExcel()" class="bg-emerald-600 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest transition hover:bg-emerald-700">Export</button>
                        <label class="bg-slate-900 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest cursor-pointer hover:bg-slate-800">
                            Import
                            <input type="file" @change="importExcel($event)" class="hidden" accept=".xlsx, .xls">
                        </label>
                    </div>
                </div>

                <div x-show="activeTab === 'jamaah'" class="fade-in space-y-6">
                    <div class="bg-white rounded-[2rem] border shadow-sm overflow-hidden">
                        <div class="p-6 border-b flex justify-between items-center bg-slate-50/50">
                            <h3 class="font-black text-lg">Data Jamaah</h3>
                            <button @click="openAddJamaah()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest" x-text="showFormJ ? 'Batal' : '+ Tambah'"></button>
                        </div>

                        <div x-show="showFormJ" class="p-6 bg-slate-50 border-b">
                            <form @submit.prevent="saveJamaah()" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div class="relative">
                                    <input type="text" x-model="formJ.paket" placeholder="Nama Paket" list="listPaket" class="w-full p-4 rounded-xl border font-bold outline-none" required>
                                    <datalist id="listPaket">
                                        <template x-for="p in listPaket()" :key="p"><option :value="p"></option></template>
                                    </datalist>
                                </div>
                                <input type="text" x-model="formJ.nama" @input="calcPax()" placeholder="Nama Jamaah (pisahkan koma untuk banyak pax)" class="p-4 rounded-xl border font-bold" required>
                                <input type="text" x-model="formJ.phone" placeholder="No WhatsApp" class="p-4 rounded-xl border font-bold">
                                <input type="date" x-model="formJ.tanggal" class="p-4 rounded-xl border font-bold" required>
                                <div class="relative">
                                    <input type="text" :value="formatInput(formJ.komisi)" @input="formJ.komisi = parseInput($event.target.value)" placeholder="Komisi / Pax" class="w-full p-4 rounded-xl border font-bold" required>
                                    <span class="absolute right-4 top-4 text-[10px] font-black text-slate-400">IDR</span>
                                </div>
                                <select x-model="formJ.status" class="p-4 rounded-xl border font-bold bg-white">
                                    <option value="Pending">Status: Pending</option>
                                    <option value="Dibayar">Status: Dibayar</option>
                                </select>
                                <button type="submit" class="bg-slate-900 text-white py-4 rounded-xl font-black uppercase text-xs" x-text="editingIdJ ? 'Update Data' : 'Simpan Data'"></button>
                            </form>
                        </div>

                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs">
                                <thead class="bg-slate-50 text-[10px] font-black text-slate-400 uppercase">
                                    <tr>
                                        <th class="px-6 py-4">Jamaah</th>
                                        <th class="px-6 py-4 text-center">Status Komisi</th>
                                        <th class="px-6 py-4 text-right">Nominal</th>
                                        <th class="px-6 py-4 text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y">
                                    <template x-for="j in paginatedJamaah()" :key="j.id">
                                        <tr class="hover:bg-slate-50">
                                            <td class="px-6 py-4">
                                                <p class="font-black" x-text="j.nama"></p>
                                                <p class="text-[10px] text-slate-400" x-text="j.paket + ' • ' + j.tanggal + ' • ' + j.pax + ' Pax'"></p>
                                                <template x-if="j.phone">
                                                    <a :href="'https://wa.me/' + formatWA(j.phone)" target="_blank" class="text-[10px] text-emerald-600 font-black mt-1 inline-block">📞 <span x-text="j.phone"></span></a>
                                                </template>
                                            </td>
                                            <td class="px-6 py-4 text-center">
                                                <button @click="toggleStatus(j)" 
                                                    :class="j.status === 'Dibayar' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'"
                                                    class="px-3 py-1 rounded-full font-black text-[9px] uppercase tracking-tighter transition-colors">
                                                    <span x-text="j.status"></span>
                                                </button>
                                            </td>
                                            <td class="px-6 py-4 text-right font-black" x-text="formatIDR(j.pax * j.komisi)"></td>
                                            <td class="px-6 py-4 text-center font-bold">
                                                <button @click="editJamaah(j)" class="text-indigo-600 mr-2">Edit</button>
                                                <button @click="deleteJamaah(j.id)" class="text-rose-600">Hapus</button>
                                            </td>
                                        </tr>
                                    </template>
                                    <template x-if="paginatedJamaah().length === 0">
                                        <tr>
                                            <td colspan="4" class="px-6 py-10 text-center text-slate-400 font-bold">Tidak ada data jamaah ditemukan.</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                        
                        <div class="p-4 bg-slate-50 border-t flex items-center justify-between">
                            <select x-model="perPageJ" @change="currentPageJ = 1" class="bg-white border rounded-lg px-2 py-1 text-xs font-bold outline-none">
                                <option value="5">5</option><option value="10">10</option><option value="50">50</option><option value="all">Semua</option>
                            </select>
                            <div class="flex items-center gap-2" x-show="perPageJ !== 'all'">
                                <button @click="currentPageJ--" :disabled="currentPageJ === 1" class="px-3 py-1 bg-white border rounded-lg disabled:opacity-30 font-bold text-xs">Prev</button>
                                <span class="text-xs font-black" x-text="currentPageJ + '/' + totalPagesJ()"></span>
                                <button @click="currentPageJ++" :disabled="currentPageJ >= totalPagesJ()" class="px-3 py-1 bg-white border rounded-lg disabled:opacity-30 font-bold text-xs">Next</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div x-show="activeTab === 'kas'" class="fade-in space-y-6">
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-[2rem] border shadow-sm h-fit">
                            <h3 class="font-black mb-4">Input Pengeluaran</h3>
                            <form @submit.prevent="addKas()" class="space-y-3">
                                <select x-model="formK.kategori" class="w-full p-4 bg-slate-50 border rounded-xl font-bold">
                                    <option value="Operasional">Operasional</option>
                                    <option value="Zakat">Zakat Terbayar</option>
                                </select>
                                <input type="text" x-model="formK.ket" placeholder="Keterangan" class="w-full p-4 bg-slate-50 border rounded-xl font-bold" required>
                                <div class="relative">
                                    <input type="text" :value="formatInput(formK.jumlah)" @input="formK.jumlah = parseInput($event.target.value)" placeholder="Nominal" class="w-full p-4 bg-slate-50 border rounded-xl font-bold" required>
                                    <span class="absolute right-4 top-4 text-[10px] font-black text-slate-400">IDR</span>
                                </div>
                                <button type="submit" class="w-full bg-rose-600 text-white py-4 rounded-xl font-black uppercase text-xs">Simpan Kas</button>
                            </form>
                        </div>

                        <div class="lg:col-span-2 bg-white rounded-[2rem] border shadow-sm overflow-hidden text-xs">
                             <div class="p-6 border-b bg-slate-50/50 flex justify-between items-center"><h3 class="font-black">Riwayat Kas</h3></div>
                             <div class="overflow-x-auto">
                                <table class="w-full text-left">
                                    <thead class="bg-slate-50 text-[10px] font-black text-slate-400 uppercase">
                                        <tr><th class="px-6 py-4">Keterangan</th><th class="px-6 py-4 text-right">Nominal</th><th class="px-6 py-4"></th></tr>
                                    </thead>
                                    <tbody class="divide-y">
                                        <template x-for="k in filteredKas()" :key="k.id">
                                            <tr>
                                                <td class="px-6 py-4"><span class="font-black" x-text="k.ket"></span><br><span class="text-[9px] text-rose-500 font-black uppercase" x-text="k.kategori"></span></td>
                                                <td class="px-6 py-4 text-right font-black text-rose-600" x-text="formatIDR(k.jumlah)"></td>
                                                <td class="px-6 py-4 text-center"><button @click="deleteKas(k.id)" class="text-slate-300 hover:text-rose-600 font-bold">×</button></td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                             </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </template>

    <script>
        function appData() {
            return {
                isLoggedIn: false, activeTab: 'jamaah', showFormJ: false, editingIdJ: null,
                jamaah: [], kas: [], client: null, currentPageJ: 1, perPageJ: 10,
                loginForm: { user: '', pass: '' }, 
                filters: { time: 'all', start: '', end: '', status: 'all' },
                formJ: { paket: '', nama: '', phone: '', tanggal: '', komisi: 0, pax: 0, status: 'Pending' },
                formK: { kategori: 'Operasional', ket: '', jumlah: 0 },

                async init() {
                    const SB_URL = "https://unjvejcnoydwfgbwzbkk.supabase.co";
                    const SB_KEY = "sb_publishable_zEhLY8Ktm3e2t_hGvjwQ1g_yPaQz1W3";
                    this.client = supabase.createClient(SB_URL, SB_KEY);
                    if (localStorage.getItem('umroh_session')) this.isLoggedIn = true;
                    await this.fetchData();
                },

                async fetchData() {
                    if (!this.client) return;
                    const { data: j } = await this.client.from('jamaah').select('*').order('tanggal', { ascending: false });
                    this.jamaah = j || [];
                    const { data: k } = await this.client.from('kas').select('*').order('id', { ascending: false });
                    this.kas = k || [];
                },

                listPaket() { return [...new Set(this.jamaah.map(i => i.paket))].sort(); },

                login() {
                    if (this.loginForm.user === 'admin' && this.loginForm.pass === '123') {
                        this.isLoggedIn = true; localStorage.setItem('umroh_session', 'true');
                    }
                },
                logout() { this.isLoggedIn = false; localStorage.removeItem('umroh_session'); },

                formatInput(val) { if (!val) return ""; return val.toString().replace(/\B(?=(\d{3})+(?!\d))/g, "."); },
                parseInput(val) { if (typeof val !== 'string') return val; return parseInt(val.replace(/\./g, "")) || 0; },
                formatIDR(n) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n); },
                formatWA(num) {
                    if(!num) return "";
                    let clean = num.replace(/\D/g, "");
                    if(clean.startsWith("0")) clean = "62" + clean.slice(1);
                    return clean;
                },
                calcPax() { 
                    if(!this.formJ.nama) { this.formJ.pax = 0; return; }
                    this.formJ.pax = this.formJ.nama.split(',').filter(n => n.trim() !== '').length; 
                },

                openAddJamaah() {
                    this.showFormJ = !this.showFormJ; 
                    this.editingIdJ = null;
                    this.formJ = { paket: '', nama: '', phone: '', tanggal: new Date().toISOString().split('T')[0], komisi: 0, pax: 0, status: 'Pending' };
                },

                async saveJamaah() {
                    this.calcPax();
                    const payload = { 
                        paket: this.formJ.paket,
                        nama: this.formJ.nama,
                        phone: this.formJ.phone,
                        tanggal: this.formJ.tanggal,
                        komisi: this.formJ.komisi,
                        pax: this.formJ.pax,
                        status: this.formJ.status 
                    };

                    if (this.editingIdJ) {
                        await this.client.from('jamaah').update(payload).eq('id', this.editingIdJ);
                    } else {
                        await this.client.from('jamaah').insert([{...payload, id: Date.now()}]);
                    }
                    await this.fetchData();
                    this.openAddJamaah();
                },

                async toggleStatus(item) {
                    const newStatus = item.status === 'Dibayar' ? 'Pending' : 'Dibayar';
                    const { error } = await this.client.from('jamaah').update({ status: newStatus }).eq('id', item.id);
                    if (error) { alert("Gagal mengubah status: " + error.message); } 
                    else { item.status = newStatus; }
                },

                editJamaah(item) {
                    this.formJ = { ...item }; 
                    this.editingIdJ = item.id; 
                    this.showFormJ = true;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },

                async deleteJamaah(id) {
                    if(confirm('Hapus data jamaah ini?')) { await this.client.from('jamaah').delete().eq('id', id); await this.fetchData(); }
                },

                async addKas() {
                    await this.client.from('kas').insert([{...this.formK, id: Date.now(), tanggal: new Date().toISOString()}]);
                    this.formK = { kategori: 'Operasional', ket: '', jumlah: 0 }; await this.fetchData();
                },

                async deleteKas(id) {
                    if(confirm('Hapus data kas?')) { await this.client.from('kas').delete().eq('id', id); await this.fetchData(); }
                },

                // FITUR EXCEL
                exportExcel() {
                    const data = this.filteredJamaah().map(j => ({
                        Tanggal: j.tanggal,
                        Paket: j.paket,
                        Nama_Jamaah: j.nama,
                        Pax: j.pax,
                        WhatsApp: j.phone,
                        Komisi_Satuan: j.komisi,
                        Total_Komisi: j.pax * j.komisi,
                        Status: j.status
                    }));
                    const worksheet = XLSX.utils.json_to_sheet(data);
                    const workbook = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(workbook, worksheet, "Data Jamaah");
                    XLSX.writeFile(workbook, `Jamaah_Export_${new Date().toISOString().split('T')[0]}.xlsx`);
                },

                async importExcel(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(firstSheet);

                        if(confirm(`Impor ${jsonData.length} data jamaah?`)) {
                            const formattedData = jsonData.map(item => ({
                                id: Date.now() + Math.floor(Math.random() * 1000),
                                tanggal: item.Tanggal || new Date().toISOString().split('T')[0],
                                paket: item.Paket || 'Umroh',
                                nama: item.Nama_Jamaah || '',
                                phone: String(item.WhatsApp || ''),
                                pax: parseInt(item.Pax) || (item.Nama_Jamaah ? item.Nama_Jamaah.split(',').length : 1),
                                komisi: parseInt(item.Komisi_Satuan) || 0,
                                status: item.Status || 'Pending'
                            }));

                            const { error } = await this.client.from('jamaah').insert(formattedData);
                            if (error) alert("Gagal impor: " + error.message);
                            else {
                                alert("Data berhasil diimpor!");
                                await this.fetchData();
                            }
                        }
                    };
                    reader.readAsArrayBuffer(file);
                    event.target.value = ""; // Reset input
                },

                applyFilter(list, isJamaah = false) {
                    return list.filter(item => {
                        const itemDate = new Date(item.tanggal);
                        itemDate.setHours(0,0,0,0);
                        const now = new Date(); now.setHours(0,0,0,0);
                        
                        let timeMatch = true;
                        if (this.filters.time === 'today') timeMatch = itemDate.getTime() === now.getTime();
                        else if (this.filters.time === 'month') timeMatch = itemDate.getMonth() === now.getMonth() && itemDate.getFullYear() === now.getFullYear();
                        else if (this.filters.time === 'year') timeMatch = itemDate.getFullYear() === now.getFullYear();
                        else if (this.filters.time === 'custom') {
                            if (this.filters.start && this.filters.end) {
                                timeMatch = itemDate >= new Date(this.filters.start) && itemDate <= new Date(this.filters.end);
                            }
                        }

                        let statusMatch = true;
                        if (isJamaah && this.filters.status !== 'all') {
                            statusMatch = item.status === this.filters.status;
                        }

                        return timeMatch && statusMatch;
                    });
                },

                filteredJamaah() { return this.applyFilter(this.jamaah, true); },
                
                paginatedJamaah() {
                    const f = this.filteredJamaah(); if (this.perPageJ === 'all') return f;
                    const limit = parseInt(this.perPageJ); return f.slice((this.currentPageJ - 1) * limit, this.currentPageJ * limit);
                },
                totalPagesJ() { return Math.ceil(this.filteredJamaah().length / parseInt(this.perPageJ)) || 1; },

                filteredKas() { return this.applyFilter(this.kas, false); },

                komisiDibayar() { return this.filteredJamaah().filter(i => i.status === 'Dibayar').reduce((s, i) => s + (i.pax * i.komisi), 0); },
                komisiPending() { return this.filteredJamaah().filter(i => i.status === 'Pending').reduce((s, i) => s + (i.pax * i.komisi), 0); },
                wajibZakat() { return this.komisiDibayar() * 0.025; },
                zakatTerbayar() { return this.filteredKas().filter(i => i.kategori === 'Zakat').reduce((s, i) => s + Number(i.jumlah), 0); },
                totalKeluar() { return this.filteredKas().reduce((s, i) => s + Number(i.jumlah), 0); },
                labaBersih() { return this.komisiDibayar() - this.totalKeluar(); }
            }
        }
    </script>
</body>
</html>
