<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UmrohPro Management - Cloud Version</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/papaparse@latest/papaparse.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        [x-cloak] { display: none !important; }
        .tab-active { background-color: #4f46e5; color: white; box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3); }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body x-data="appData()" x-init="init()" class="antialiased text-slate-900">

    <template x-if="!isLoggedIn">
        <div class="min-h-screen flex items-center justify-center bg-slate-950 p-6">
            <div class="bg-white p-10 rounded-[2.5rem] w-full max-w-md shadow-2xl">
                <div class="text-center mb-10">
                    <h1 class="text-3xl font-black tracking-tight">Umroh<span class="text-indigo-600">Pro</span></h1>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-2">Secure Cloud System</p>
                </div>
                <form @submit.prevent="login()" class="space-y-5">
                    <input type="text" x-model="loginForm.user" placeholder="Username" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-indigo-500 font-bold">
                    <input type="password" x-model="loginForm.pass" placeholder="Password" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-indigo-500 font-bold">
                    <button type="submit" class="w-full bg-slate-900 text-white py-5 rounded-xl font-black uppercase text-xs tracking-widest hover:bg-indigo-600 transition-all">Masuk</button>
                </form>
            </div>
        </div>
    </template>

    <template x-if="isLoggedIn">
        <div class="min-h-screen flex flex-col">
            <header class="bg-white border-b border-slate-200 p-4 md:p-6 flex flex-wrap md:flex-nowrap justify-between items-center sticky top-0 z-50 gap-4">
                <div class="flex items-center gap-4 md:gap-8">
                    <div class="flex items-center gap-3">
                        <div class="bg-indigo-600 p-2 rounded-lg text-white shadow-lg">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                        </div>
                        <h2 class="font-black text-xl tracking-tighter">Umroh<span class="text-indigo-600">Pro</span></h2>
                    </div>
                    <nav class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl overflow-x-auto">
                        <button @click="activeTab = 'jamaah'" :class="activeTab === 'jamaah' ? 'tab-active' : 'text-slate-500'" class="whitespace-nowrap px-4 md:px-6 py-2 rounded-lg text-[10px] md:text-xs font-black uppercase tracking-widest transition-all">Jamaah</button>
                        <button @click="activeTab = 'kas'" :class="activeTab === 'kas' ? 'tab-active' : 'text-slate-500'" class="whitespace-nowrap px-4 md:px-6 py-2 rounded-lg text-[10px] md:text-xs font-black uppercase tracking-widest transition-all">Kas & Zakat</button>
                    </nav>
                </div>
                <button @click="logout()" class="text-rose-600 font-black text-xs uppercase tracking-widest flex items-center gap-2 hover:bg-rose-50 px-4 py-2 rounded-xl transition-all">Keluar</button>
            </header>

            <main class="max-w-7xl mx-auto w-full p-4 md:p-6 flex-1">
                
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
                    <div class="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm flex items-center gap-4">
                        <div class="p-3 bg-blue-50 text-blue-600 rounded-xl"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div>
                        <div><p class="text-[10px] font-black text-slate-400 uppercase">Total Jamaah</p><h3 class="text-2xl font-black" x-text="totalPax() + ' Pax'"></h3></div>
                    </div>
                    <div class="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm flex items-center gap-4">
                        <div class="p-3 bg-indigo-50 text-indigo-600 rounded-xl"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/><circle cx="12" cy="12" r="10"/></svg></div>
                        <div><p class="text-[10px] font-black text-slate-400 uppercase">Total Komisi</p><h3 class="text-xl font-black text-slate-800" x-text="formatIDR(totalKomisi())"></h3></div>
                    </div>
                    <div class="bg-amber-500 p-6 rounded-[2rem] text-white shadow-xl shadow-amber-500/20">
                        <div class="flex items-center justify-between mb-2">
                            <p class="text-[10px] font-black uppercase">Laporan Zakat (2.5%)</p>
                        </div>
                        <div class="space-y-1">
                            <div class="flex justify-between text-[11px] font-bold opacity-80"><span>Wajib:</span> <span x-text="formatIDR(wajibZakat())"></span></div>
                            <div class="flex justify-between text-[11px] font-bold opacity-80"><span>Sisa:</span> <span x-text="formatIDR(wajibZakat() - zakatTerbayar())"></span></div>
                        </div>
                    </div>
                    <div class="bg-slate-900 p-6 rounded-[2rem] text-white flex items-center gap-4 shadow-xl">
                        <div class="p-3 bg-indigo-600 rounded-2xl"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
                        <div><p class="text-[10px] font-black text-slate-400 uppercase">Laba Bersih</p><h3 class="text-xl font-black" x-text="formatIDR(labaBersih())"></h3></div>
                    </div>
                </div>

                <div x-show="activeTab === 'jamaah'" class="space-y-6 fade-in">
                    <div class="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm flex flex-wrap items-center gap-4">
                        <div class="flex items-center gap-3 bg-slate-50 px-4 py-2 rounded-xl border">
                            <span class="text-[10px] font-black text-slate-400 uppercase">Periode:</span>
                            <select x-model="filters.time" @change="currentPage = 1" class="bg-transparent text-xs font-black outline-none cursor-pointer">
                                <option value="all">Semua Waktu</option>
                                <option value="today">Hari Ini</option>
                                <option value="yesterday">Kemarin</option>
                                <option value="7days">7 Hari Terakhir</option>
                                <option value="14days">14 Hari Terakhir</option>
                                <option value="30days">30 Hari Terakhir</option>
                                <option value="month">Bulan Ini</option>
                                <option value="year">Tahun Ini</option>
                                <option value="custom">Rentang Custom</option>
                            </select>
                        </div>

                        <template x-if="filters.time === 'custom'">
                            <div class="flex items-center gap-2 fade-in">
                                <input type="date" x-model="filters.start" class="bg-slate-50 border px-3 py-2 rounded-xl text-xs font-bold outline-none">
                                <span class="text-xs font-black text-slate-400">-</span>
                                <input type="date" x-model="filters.end" class="bg-slate-50 border px-3 py-2 rounded-xl text-xs font-bold outline-none">
                            </div>
                        </template>

                        <div class="flex items-center gap-3 bg-slate-50 px-4 py-2 rounded-xl border">
                            <span class="text-[10px] font-black text-slate-400 uppercase">Status:</span>
                            <select x-model="filters.status" @change="currentPage = 1" class="bg-transparent text-xs font-black outline-none cursor-pointer">
                                <option value="all">Semua Status</option>
                                <option value="Pending">🕒 Pending</option>
                                <option value="Cair">✅ Sudah Cair</option>
                            </select>
                        </div>
                    </div>

                    <div class="bg-white rounded-[2.5rem] border border-slate-200 shadow-sm overflow-hidden">
                        <div class="p-8 border-b flex justify-between items-center bg-slate-50/30">
                            <h3 class="font-black text-xl tracking-tight text-slate-800">Database Jamaah</h3>
                            <button @click="openAddForm()" class="bg-indigo-600 text-white px-8 py-3 rounded-xl text-xs font-black uppercase tracking-widest shadow-lg hover:bg-indigo-700 transition-all">
                                <span x-text="showForm ? 'Batal' : '+ Tambah Jamaah'"></span>
                            </button>
                        </div>

                        <div x-show="showForm" class="p-8 bg-slate-50 border-b border-slate-200">
                            <form @submit.prevent="saveJamaah()" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div class="space-y-2">
                                    <label class="text-[10px] font-black text-slate-400 uppercase ml-1">Paket Umroh</label>
                                    <input type="text" x-model="formJ.paket" placeholder="Nama Paket" class="w-full p-4 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 font-bold" required>
                                </div>
                                <div class="space-y-2">
                                    <label class="text-[10px] font-black text-slate-400 uppercase ml-1">Nama Jamaah (Pisahkan Koma)</label>
                                    <input type="text" x-model="formJ.nama" @input="calcPax()" placeholder="Ani, Budi..." class="w-full p-4 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 font-bold" required>
                                </div>
                                <div class="space-y-2">
                                    <label class="text-[10px] font-black text-slate-400 uppercase ml-1">Tanggal Berangkat</label>
                                    <input type="date" x-model="formJ.tanggal" class="w-full p-4 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 font-bold" required>
                                </div>
                                <div class="space-y-2">
                                    <label class="text-[10px] font-black text-slate-400 uppercase ml-1">Komisi / Pax</label>
                                    <input type="number" x-model="formJ.komisi" class="w-full p-4 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 font-bold" required>
                                </div>
                                <div class="space-y-2">
                                    <label class="text-[10px] font-black text-slate-400 uppercase ml-1">Jumlah Pax</label>
                                    <div class="w-full p-4 bg-indigo-50 text-indigo-600 rounded-xl font-black" x-text="formJ.pax + ' PAX'"></div>
                                </div>
                                <button type="submit" class="md:col-span-3 bg-slate-900 text-white py-5 rounded-xl font-black uppercase text-xs tracking-widest hover:bg-indigo-600 transition-all">Simpan Data</button>
                            </form>
                        </div>

                        <div class="overflow-x-auto">
                            <table class="w-full text-left">
                                <thead class="bg-slate-50 text-[10px] font-black text-slate-400 uppercase">
                                    <tr>
                                        <th class="px-8 py-5">Paket & Nama</th>
                                        <th class="px-8 py-5 text-center">Pax</th>
                                        <th class="px-8 py-5 text-center">Total Komisi</th>
                                        <th class="px-8 py-5 text-center">Status</th>
                                        <th class="px-8 py-5 text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    <template x-for="j in paginatedJamaah()" :key="j.id">
                                        <tr class="hover:bg-slate-50">
                                            <td class="px-8 py-6">
                                                <p class="text-[10px] font-black text-indigo-600 uppercase" x-text="j.paket"></p>
                                                <p class="font-black text-slate-800" x-text="j.nama"></p>
                                                <p class="text-[10px] text-slate-400 font-bold" x-text="j.tanggal"></p>
                                            </td>
                                            <td class="px-8 py-6 text-center">
                                                <span class="bg-indigo-50 text-indigo-600 px-3 py-1 rounded-lg text-xs font-black" x-text="j.pax"></span>
                                            </td>
                                            <td class="px-8 py-6 text-center font-black" x-text="formatIDR(j.pax * j.komisi)"></td>
                                            <td class="px-8 py-6 text-center">
                                                <button @click="toggleCair(j.id)" :class="j.status === 'Cair' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'" class="px-4 py-1.5 rounded-lg text-[10px] font-black uppercase transition-all">
                                                    <span x-text="j.status"></span>
                                                </button>
                                            </td>
                                            <td class="px-8 py-6 text-center">
                                                <button @click="deleteJamaah(j.id)" class="text-slate-300 hover:text-rose-600 transition-all">Hapus</button>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div x-show="activeTab === 'kas'" class="grid grid-cols-1 lg:grid-cols-3 gap-8 fade-in">
                    <div class="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm h-fit">
                        <h3 class="font-black text-xl mb-6">Input Pengeluaran</h3>
                        <form @submit.prevent="addKas()" class="space-y-4">
                            <select x-model="formK.kategori" class="w-full p-4 bg-slate-50 border rounded-xl font-bold">
                                <option value="Operasional">Operasional</option>
                                <option value="Zakat">Zakat Terbayar</option>
                            </select>
                            <input type="text" x-model="formK.ket" placeholder="Keterangan" class="w-full p-4 bg-slate-50 border rounded-xl font-bold" required>
                            <input type="number" x-model="formK.jumlah" placeholder="Nominal" class="w-full p-4 bg-slate-50 border rounded-xl font-bold" required>
                            <button type="submit" class="w-full bg-rose-600 text-white py-5 rounded-xl font-black uppercase text-xs tracking-widest hover:bg-slate-900 transition-all">Simpan Pengeluaran</button>
                        </form>
                    </div>

                    <div class="lg:col-span-2 bg-white rounded-[2.5rem] border border-slate-200 shadow-sm overflow-hidden">
                        <div class="p-8 border-b font-black text-xl">Arsip Kas</div>
                        <table class="w-full text-left">
                            <thead class="bg-slate-50 text-[10px] font-black text-slate-400 uppercase">
                                <tr>
                                    <th class="px-8 py-4">Kategori & Ket</th>
                                    <th class="px-8 py-4 text-center">Nominal</th>
                                    <th class="px-8 py-4 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="k in kas" :key="k.id">
                                    <tr class="hover:bg-slate-50 border-b">
                                        <td class="px-8 py-4">
                                            <p class="text-[10px] font-black text-rose-600 uppercase" x-text="k.kategori"></p>
                                            <p class="font-black" x-text="k.ket"></p>
                                        </td>
                                        <td class="px-8 py-4 text-center font-black text-rose-600" x-text="'- ' + formatIDR(k.jumlah)"></td>
                                        <td class="px-8 py-4 text-center">
                                            <button @click="deleteKas(k.id)" class="text-slate-300 hover:text-rose-600">Hapus</button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </template>

    <script>
        function appData() {
            return {
                isLoggedIn: false,
                activeTab: 'jamaah',
                showForm: false,
                jamaah: [],
                kas: [],
                client: null,
                currentPage: 1,
                itemsPerPage: 10,
                loginForm: { user: '', pass: '' },
                filters: { 
                    time: 'all', 
                    status: 'all',
                    start: '',
                    end: ''
                },
                formJ: { paket: '', nama: '', tanggal: '', komisi: 0, pax: 0, status: 'Pending' },
                formK: { kategori: 'Operasional', ket: '', jumlah: 0 },

                async init() {
                    const SB_URL = "https://unjvejcnoydwfgbwzbkk.supabase.co";
                    const SB_KEY = "sb_publishable_zEhLY8Ktm3e2t_hGvjwQ1g_yPaQz1W3";
                    this.client = supabase.createClient(SB_URL, SB_KEY);

                    if (localStorage.getItem('umroh_session_final')) this.isLoggedIn = true;
                    await this.fetchData();
                },

                async fetchData() {
                    if (!this.client) return;
                    const { data: jData } = await this.client.from('jamaah').select('*').order('id', { ascending: false });
                    if (jData) this.jamaah = jData;
                    const { data: kData } = await this.client.from('kas').select('*').order('id', { ascending: false });
                    if (kData) this.kas = kData;
                },

                login() {
                    if (this.loginForm.user === 'admin' && this.loginForm.pass === '123') {
                        this.isLoggedIn = true;
                        localStorage.setItem('umroh_session_final', 'true');
                    }
                },

                logout() {
                    this.isLoggedIn = false;
                    localStorage.removeItem('umroh_session_final');
                },

                calcPax() {
                    this.formJ.pax = this.formJ.nama.split(',').filter(n => n.trim() !== '').length;
                },

                openAddForm() { this.showForm = !this.showForm; },

                async saveJamaah() {
                    const payload = { ...this.formJ, id: Date.now() };
                    await this.client.from('jamaah').insert([payload]);
                    await this.fetchData();
                    this.showForm = false;
                    this.formJ = { paket: '', nama: '', tanggal: '', komisi: 0, pax: 0, status: 'Pending' };
                },

                async toggleCair(id) {
                    const item = this.jamaah.find(i => i.id === id);
                    const newStatus = item.status === 'Cair' ? 'Pending' : 'Cair';
                    await this.client.from('jamaah').update({ status: newStatus }).eq('id', id);
                    await this.fetchData();
                },

                async deleteJamaah(id) {
                    if(confirm('Hapus?')) {
                        await this.client.from('jamaah').delete().eq('id', id);
                        await this.fetchData();
                    }
                },

                async addKas() {
                    const payload = { ...this.formK, id: Date.now(), tanggal: new Date().toISOString() };
                    await this.client.from('kas').insert([payload]);
                    await this.fetchData();
                    this.formK = { kategori: 'Operasional', ket: '', jumlah: 0 };
                },

                async deleteKas(id) {
                    if(confirm('Hapus?')) {
                        await this.client.from('kas').delete().eq('id', id);
                        await this.fetchData();
                    }
                },

                filteredJamaahList() {
                    return this.jamaah.filter(item => {
                        // Filter Status
                        if (this.filters.status !== 'all' && item.status !== this.filters.status) return false;

                        // Filter Waktu
                        const itemDate = new Date(item.tanggal);
                        itemDate.setHours(0,0,0,0);
                        const now = new Date();
                        now.setHours(0,0,0,0);

                        if (this.filters.time === 'today') {
                            return itemDate.getTime() === now.getTime();
                        }
                        if (this.filters.time === 'yesterday') {
                            const yesterday = new Date(now);
                            yesterday.setDate(now.getDate() - 1);
                            return itemDate.getTime() === yesterday.getTime();
                        }
                        if (this.filters.time === '7days') {
                            const limit = new Date(now);
                            limit.setDate(now.getDate() - 7);
                            return itemDate >= limit;
                        }
                        if (this.filters.time === '14days') {
                            const limit = new Date(now);
                            limit.setDate(now.getDate() - 14);
                            return itemDate >= limit;
                        }
                        if (this.filters.time === '30days') {
                            const limit = new Date(now);
                            limit.setDate(now.getDate() - 30);
                            return itemDate >= limit;
                        }
                        if (this.filters.time === 'month') {
                            return itemDate.getMonth() === now.getMonth() && itemDate.getFullYear() === now.getFullYear();
                        }
                        if (this.filters.time === 'year') {
                            return itemDate.getFullYear() === now.getFullYear();
                        }
                        if (this.filters.time === 'custom') {
                            if (!this.filters.start || !this.filters.end) return true;
                            const start = new Date(this.filters.start);
                            const end = new Date(this.filters.end);
                            return itemDate >= start && itemDate <= end;
                        }
                        return true; // Untuk 'all'
                    });
                },

                paginatedJamaah() {
                    const filtered = this.filteredJamaahList();
                    const start = (this.currentPage - 1) * this.itemsPerPage;
                    return filtered.slice(start, start + this.itemsPerPage);
                },

                totalPax() { return this.filteredJamaahList().reduce((s, i) => s + Number(i.pax), 0); },
                totalKomisi() { return this.filteredJamaahList().reduce((s, i) => s + (i.pax * i.komisi), 0); },
                komisiCair() { return this.filteredJamaahList().filter(i => i.status === 'Cair').reduce((s, i) => s + (i.pax * i.komisi), 0); },
                wajibZakat() { return this.komisiCair() * 0.025; },
                zakatTerbayar() { return this.kas.filter(i => i.kategori === 'Zakat').reduce((s, i) => s + Number(i.jumlah), 0); },
                totalKeluar() { return this.kas.reduce((s, i) => s + Number(i.jumlah), 0); },
                labaBersih() { return this.komisiCair() - this.totalKeluar(); },

                formatIDR(n) {
                    return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n);
                }
            }
        }
    </script>
</body>
</html>
