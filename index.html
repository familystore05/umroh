<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UmrohPro Management - Ultimate Version</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/papaparse@latest/papaparse.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        [x-cloak] { display: none !important; }
        .tab-active { background-color: #4f46e5; color: white; box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body x-data="appData()" x-init="init()" class="antialiased text-slate-900">

    <template x-if="!isLoggedIn">
        <div class="min-h-screen flex items-center justify-center bg-slate-950 p-6">
            <div class="bg-white p-10 rounded-[2.5rem] w-full max-w-md shadow-2xl border border-white/10">
                <div class="text-center mb-10">
                    <div class="bg-indigo-600 w-16 h-16 rounded-2xl flex items-center justify-center text-white mx-auto mb-4 shadow-xl">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    </div>
                    <h1 class="text-3xl font-black tracking-tight">Umroh<span class="text-indigo-600">Pro</span></h1>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-[0.2em] mt-2">Secure Enterprise System</p>
                </div>
                <form @submit.prevent="login()" class="space-y-5">
                    <input type="text" x-model="loginForm.user" placeholder="Username" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-indigo-500 font-bold">
                    <input type="password" x-model="loginForm.pass" placeholder="Password" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-indigo-500 font-bold">
                    <button type="submit" class="w-full bg-slate-900 text-white py-5 rounded-xl font-black uppercase text-xs tracking-widest hover:bg-indigo-600 transition-all">Masuk</button>
                </form>
            </div>
        </div>
    </template>

    <template x-if="isLoggedIn">
        <div class="min-h-screen flex flex-col">
            <header class="bg-white border-b border-slate-200 p-6 flex justify-between items-center sticky top-0 z-50">
                <div class="flex items-center gap-8">
                    <div class="flex items-center gap-3">
                        <div class="bg-indigo-600 p-2 rounded-lg text-white shadow-lg shadow-indigo-500/30">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                        </div>
                        <h2 class="font-black text-xl tracking-tighter">Umroh<span class="text-indigo-600">Pro</span></h2>
                    </div>
                    <nav class="hidden md:flex items-center gap-2 bg-slate-100 p-1 rounded-xl">
                        <button @click="activeTab = 'jamaah'" :class="activeTab === 'jamaah' ? 'tab-active' : 'text-slate-500'" class="px-6 py-2 rounded-lg text-xs font-black uppercase tracking-widest transition-all">Jamaah</button>
                        <button @click="activeTab = 'kas'" :class="activeTab === 'kas' ? 'tab-active' : 'text-slate-500'" class="px-6 py-2 rounded-lg text-xs font-black uppercase tracking-widest transition-all">Kas & Zakat</button>
                    </nav>
                </div>
                <button @click="logout()" class="text-rose-600 font-black text-xs uppercase tracking-widest flex items-center gap-2 hover:bg-rose-50 px-4 py-2 rounded-xl transition-all">
                    Keluar <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
                </button>
            </header>

            <main class="max-w-7xl mx-auto w-full p-6 flex-1">
                
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
                    <div class="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm flex items-center gap-4">
                        <div class="p-3 bg-blue-50 text-blue-600 rounded-xl"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
                        <div><p class="text-[10px] font-black text-slate-400 uppercase">Total Jamaah</p><h3 class="text-2xl font-black" x-text="totalPax() + ' Pax'"></h3></div>
                    </div>
                    <div class="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm flex items-center gap-4">
                        <div class="p-3 bg-indigo-50 text-indigo-600 rounded-xl"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></div>
                        <div><p class="text-[10px] font-black text-slate-400 uppercase">Total Komisi</p><h3 class="text-xl font-black text-slate-800" x-text="formatIDR(totalKomisi())"></h3></div>
                    </div>
                    <div class="bg-amber-500 p-6 rounded-[2rem] text-white shadow-xl shadow-amber-500/20">
                        <div class="flex items-center gap-4 mb-3">
                            <div class="p-2 bg-white/20 rounded-lg"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
                            <p class="text-[10px] font-black uppercase">Laporan Zakat</p>
                        </div>
                        <div class="space-y-1">
                            <div class="flex justify-between text-[11px] font-bold opacity-80"><span>Wajib:</span> <span x-text="formatIDR(wajibZakat())"></span></div>
                            <div class="flex justify-between text-[11px] font-bold opacity-80"><span>Terbayar:</span> <span x-text="formatIDR(zakatTerbayar())"></span></div>
                            <div class="h-px bg-white/20 my-1"></div>
                            <div class="flex justify-between text-sm font-black"><span>Sisa:</span> <span x-text="formatIDR(wajibZakat() - zakatTerbayar())"></span></div>
                        </div>
                    </div>
                    <div class="bg-slate-900 p-6 rounded-[2rem] text-white flex items-center gap-4 shadow-xl">
                        <div class="p-3 bg-indigo-600 rounded-2xl"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
                        <div><p class="text-[10px] font-black text-slate-400 uppercase">Laba Bersih</p><h3 class="text-xl font-black" x-text="formatIDR(labaBersih())"></h3></div>
                    </div>
                </div>

                <div x-show="activeTab === 'jamaah'" class="space-y-6 fade-in">
                    
                    <div class="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-6">
                        <div class="flex flex-wrap items-center gap-4">
                            <div class="flex items-center gap-3 bg-slate-50 px-4 py-2 rounded-xl border">
                                <span class="text-[10px] font-black text-slate-400 uppercase">Periode:</span>
                                <select x-model="filters.time" @change="currentPage = 1" class="bg-transparent text-xs font-black outline-none cursor-pointer">
                                    <option value="all">Semua Waktu</option>
                                    <option value="today">Hari Ini</option>
                                    <option value="week">Minggu Ini</option>
                                    <option value="month">Bulan Ini</option>
                                    <option value="year">Tahun Ini</option>
                                    <option value="custom">Custom Range</option>
                                </select>
                            </div>
                            <div class="flex items-center gap-3 bg-slate-50 px-4 py-2 rounded-xl border">
                                <span class="text-[10px] font-black text-slate-400 uppercase">Status:</span>
                                <select x-model="filters.status" @change="currentPage = 1" class="bg-transparent text-xs font-black outline-none cursor-pointer">
                                    <option value="all">Semua Status</option>
                                    <option value="Pending">🕒 Pending</option>
                                    <option value="Cair">✅ Sudah Cair</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="flex items-center gap-2">
                            <button @click="exportCSV()" class="p-2.5 text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-all" title="Ekspor ke Excel/CSV">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                            </button>
                            <button @click="$refs.fileInput.click()" class="p-2.5 text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-all" title="Impor dari Excel/CSV">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                            </button>
                            <input type="file" x-ref="fileInput" @change="importCSV($event)" class="hidden" accept=".csv">
                        </div>
                    </div>

                    <div class="bg-white rounded-[2.5rem] border border-slate-200 shadow-sm overflow-hidden">
                        <div class="p-8 border-b border-slate-100 flex justify-between items-center bg-slate-50/30">
                            <h3 class="font-black text-xl tracking-tight text-slate-800">Database Keberangkatan</h3>
                            <button @click="openAddForm()" class="bg-indigo-600 text-white px-8 py-3 rounded-xl text-xs font-black uppercase tracking-widest shadow-lg shadow-indigo-500/30 hover:bg-indigo-700 transition-all">
                                <span x-text="showForm ? 'Batal' : '+ Tambah Jamaah'"></span>
                            </button>
                        </div>

                        <div x-show="showForm" class="p-8 bg-slate-50 border-b border-slate-200">
                            <form @submit.prevent="saveJamaah()" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div class="space-y-2">
                                    <label class="text-[10px] font-black text-slate-400 uppercase ml-1">Paket Umroh</label>
                                    <input type="text" x-model="formJ.paket" list="list-paket" placeholder="Contoh: Ramadhan Hemat" class="w-full p-4 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 font-bold" required>
                                    <datalist id="list-paket">
                                        <template x-for="p in getUniquePaket()" :key="p">
                                            <option :value="p"></option>
                                        </template>
                                    </datalist>
                                </div>
                                <div class="space-y-2">
                                    <label class="text-[10px] font-black text-slate-400 uppercase ml-1">Nama Jamaah (Pisahkan Koma)</label>
                                    <input type="text" x-model="formJ.nama" @input="calcPax()" placeholder="Ani, Budi, Caca..." class="w-full p-4 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 font-bold" required>
                                </div>
                                <div class="space-y-2">
                                    <label class="text-[10px] font-black text-slate-400 uppercase ml-1">No. WhatsApp</label>
                                    <input type="text" x-model="formJ.wa" placeholder="08123..." class="w-full p-4 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 font-bold">
                                </div>
                                <div class="space-y-2">
                                    <label class="text-[10px] font-black text-slate-400 uppercase ml-1">Tanggal Berangkat</label>
                                    <input type="date" x-model="formJ.tanggal" class="w-full p-4 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 font-bold" required>
                                </div>
                                <div class="space-y-2">
                                    <label class="text-[10px] font-black text-slate-400 uppercase ml-1">Komisi / Pax (IDR)</label>
                                    <input type="text" :value="formatInput(formJ.komisi)" @input="formJ.komisi = parseInput($event.target.value)" placeholder="1.000.000" class="w-full p-4 rounded-xl border border-slate-200 outline-none focus:border-indigo-500 font-bold" required>
                                </div>
                                <div class="space-y-2">
                                    <label class="text-[10px] font-black text-slate-400 uppercase ml-1">Jumlah Pax (Otomatis)</label>
                                    <div class="w-full p-4 bg-indigo-50 text-indigo-600 rounded-xl font-black border border-indigo-100" x-text="formJ.pax + ' PAX'"></div>
                                </div>
                                <button type="submit" class="md:col-span-3 bg-slate-900 text-white py-5 rounded-xl font-black uppercase text-xs tracking-[0.2em] shadow-xl hover:bg-indigo-600 transition-all" x-text="editingIndex === null ? 'Simpan Data Jamaah' : 'Update Data Jamaah'"></button>
                            </form>
                        </div>

                        <div class="overflow-x-auto">
                            <table class="w-full text-left">
                                <thead class="bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest">
                                    <tr>
                                        <th class="px-8 py-5">Paket & Nama</th>
                                        <th class="px-8 py-5 text-center">Kontak</th>
                                        <th class="px-8 py-5 text-center">Pax</th>
                                        <th class="px-8 py-5 text-center">Total Komisi</th>
                                        <th class="px-8 py-5 text-center">Status Cair</th>
                                        <th class="px-8 py-5 text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    <template x-for="(j, index) in paginatedJamaah()" :key="j.id">
                                        <tr class="hover:bg-slate-50/80 transition-colors">
                                            <td class="px-8 py-6">
                                                <p class="text-[10px] font-black text-indigo-600 uppercase mb-1" x-text="j.paket"></p>
                                                <p class="font-black text-slate-800 text-base" x-text="j.nama"></p>
                                                <p class="text-[10px] text-slate-400 font-bold mt-1" x-text="'Berangkat: ' + j.tanggal"></p>
                                            </td>
                                            <td class="px-8 py-6 text-center">
                                                <template x-if="j.wa">
                                                    <a :href="'https://wa.me/' + j.wa.replace(/\D/g,'')" target="_blank" class="inline-flex items-center gap-2 px-4 py-2 bg-emerald-50 text-emerald-600 rounded-xl text-xs font-black uppercase tracking-widest hover:bg-emerald-600 hover:text-white transition-all border border-emerald-100">
                                                        <span x-text="j.wa"></span>
                                                    </a>
                                                </template>
                                            </td>
                                            <td class="px-8 py-6 text-center">
                                                <span class="bg-indigo-50 text-indigo-600 px-4 py-2 rounded-xl text-xs font-black border border-indigo-100" x-text="j.pax + ' PAX'"></span>
                                            </td>
                                            <td class="px-8 py-6 text-center font-black text-slate-700" x-text="formatIDR(j.pax * j.komisi)"></td>
                                            <td class="px-8 py-6 text-center">
                                                <button @click="toggleCair(j.id)" :class="j.status === 'Cair' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'" class="px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all">
                                                    <span x-text="j.status === 'Cair' ? '✅ Sudah Cair' : '🕒 Pending'"></span>
                                                </button>
                                            </td>
                                            <td class="px-8 py-6 text-center">
                                                <div class="flex items-center justify-center gap-2">
                                                    <button @click="editJamaah(j.id)" class="p-2 text-slate-400 hover:text-indigo-600 transition-all"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
                                                    <button @click="deleteJamaah(j.id)" class="p-2 text-slate-400 hover:text-rose-600 transition-all"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>

                        <div class="p-8 bg-slate-50 border-t flex flex-wrap items-center justify-between gap-6">
                            <div class="flex items-center gap-4">
                                <span class="text-[10px] font-black text-slate-400 uppercase">Tampilkan:</span>
                                <select x-model="itemsPerPage" @change="currentPage = 1" class="bg-white border px-3 py-1.5 rounded-lg text-xs font-black outline-none cursor-pointer">
                                    <option value="5">5</option>
                                    <option value="10">10</option>
                                    <option value="50">50</option>
                                    <option value="100">100</option>
                                    <option value="500">500</option>
                                    <option value="-1">Semua</option>
                                </select>
                            </div>

                            <div class="flex items-center gap-2" x-show="itemsPerPage != -1">
                                <button @click="currentPage--" :disabled="currentPage === 1" class="p-2 rounded-lg border bg-white text-slate-400 disabled:opacity-30 hover:text-indigo-600 transition-all">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="15 18 9 12 15 6"/></svg>
                                </button>
                                <div class="px-4 py-1.5 bg-indigo-50 rounded-lg text-xs font-black text-indigo-600">
                                    Halaman <span x-text="currentPage"></span> dari <span x-text="totalPages()"></span>
                                </div>
                                <button @click="currentPage++" :disabled="currentPage >= totalPages()" class="p-2 rounded-lg border bg-white text-slate-400 disabled:opacity-30 hover:text-indigo-600 transition-all">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="9 18 15 12 9 6"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div x-show="activeTab === 'kas'" class="fade-in">
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div class="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm h-fit">
                            <h3 class="font-black text-xl mb-6 text-slate-800">Input Pengeluaran</h3>
                            <form @submit.prevent="addKas()" class="space-y-4">
                                <div>
                                    <label class="text-[10px] font-black text-slate-400 uppercase ml-1">Kategori</label>
                                    <select x-model="formK.kategori" class="w-full p-4 mt-1 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-rose-500 font-bold">
                                        <option value="Operasional">🏢 Operasional</option>
                                        <option value="Zakat">🕌 Zakat Terbayar</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="text-[10px] font-black text-slate-400 uppercase ml-1">Keterangan</label>
                                    <input type="text" x-model="formK.ket" placeholder="Contoh: Listrik Kantor" class="w-full p-4 mt-1 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-rose-500 font-bold" required>
                                </div>
                                <div>
                                    <label class="text-[10px] font-black text-slate-400 uppercase ml-1">Nominal (IDR)</label>
                                    <input type="text" :value="formatInput(formK.jumlah)" @input="formK.jumlah = parseInput($event.target.value)" placeholder="500.000" class="w-full p-4 mt-1 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-rose-500 font-bold" required>
                                </div>
                                <button type="submit" class="w-full bg-rose-600 text-white py-5 rounded-xl font-black uppercase text-xs tracking-widest shadow-lg shadow-rose-500/20 hover:bg-slate-900 transition-all">Simpan Transaksi</button>
                            </form>
                        </div>

                        <div class="lg:col-span-2 bg-white rounded-[2.5rem] border border-slate-200 shadow-sm overflow-hidden">
                            <div class="p-8 border-b bg-slate-50/30 font-black text-xl">Arsip Transaksi</div>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left">
                                    <thead class="bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest">
                                        <tr>
                                            <th class="px-8 py-4">Kategori & Ket</th>
                                            <th class="px-8 py-4 text-center">Nominal</th>
                                            <th class="px-8 py-4 text-center">Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-100">
                                        <template x-for="(k, index) in kas" :key="index">
                                            <tr class="hover:bg-slate-50">
                                                <td class="px-8 py-6">
                                                    <span :class="k.kategori === 'Zakat' ? 'bg-amber-100 text-amber-700' : 'bg-rose-100 text-rose-700'" class="px-3 py-1 rounded-lg text-[10px] font-black uppercase tracking-widest" x-text="k.kategori === 'Zakat' ? 'Zakat Maal' : 'Operasional'"></span>
                                                    <p class="font-black text-slate-800 mt-2" x-text="k.ket"></p>
                                                    <p class="text-[10px] text-slate-400 font-bold" x-text="k.tanggal"></p>
                                                </td>
                                                <td class="px-8 py-6 text-center font-black text-rose-600" x-text="'- ' + formatIDR(k.jumlah)"></td>
                                                <td class="px-8 py-6 text-center">
                                                    <button @click="deleteKas(index)" class="p-3 text-slate-300 hover:text-rose-600 transition-all"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </main>

            <footer class="p-10 text-center text-slate-400">
                <p class="text-[10px] font-black uppercase tracking-[0.4em]">UmrohPro Enterprise • v7.0 Ultimate</p>
            </footer>
        </div>
    </template>

    <script>
        function appData() {
            return {
                isLoggedIn: false,
                activeTab: 'jamaah',
                showForm: false,
                editingIndex: null,
                jamaah: [],
                kas: [],
                filters: { time: 'all', status: 'all', start: '', end: '' },
                currentPage: 1,
                itemsPerPage: 10,
                loginForm: { user: '', pass: '' },
                formJ: { id: null, paket: '', nama: '', wa: '', tanggal: new Date().toISOString().split('T')[0], komisi: 0, pax: 0, status: 'Pending' },
                formK: { kategori: 'Operasional', ket: '', jumlah: 0 },

                init() {
                    const savedJ = localStorage.getItem('umroh_db_j');
                    if (savedJ) this.jamaah = JSON.parse(savedJ);
                    const savedK = localStorage.getItem('umroh_db_k');
                    if (savedK) this.kas = JSON.parse(savedK);
                    const session = localStorage.getItem('umroh_session_final');
                    if (session) this.isLoggedIn = true;
                },

                login() {
                    if (this.loginForm.user === 'admin' && this.loginForm.pass === '123') {
                        this.isLoggedIn = true;
                        localStorage.setItem('umroh_session_final', 'true');
                    } else { alert('Gagal!'); }
                },

                logout() {
                    this.isLoggedIn = false;
                    localStorage.removeItem('umroh_session_final');
                },

                formatInput(val) {
                    if (!val) return "";
                    return val.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
                },
                parseInput(val) {
                    return parseInt(val.replace(/\./g, "")) || 0;
                },

                calcPax() {
                    const names = this.formJ.nama.split(',').filter(n => n.trim() !== '');
                    this.formJ.pax = names.length || 0;
                },

                openAddForm() {
                    if (this.showForm) {
                        this.showForm = false;
                        this.editingIndex = null;
                    } else {
                        this.formJ = { id: Date.now(), paket: '', nama: '', wa: '', tanggal: new Date().toISOString().split('T')[0], komisi: 0, pax: 0, status: 'Pending' };
                        this.showForm = true;
                    }
                },

                // MODIFIKASI: Menambahkan fungsi untuk list paket unik
                getUniquePaket() {
                    const paketSet = new Set(this.jamaah.map(j => j.paket));
                    return Array.from(paketSet).filter(p => p && p.trim() !== '');
                },

                saveJamaah() {
                    if (this.editingIndex !== null) {
                        const idx = this.jamaah.findIndex(item => item.id === this.editingIndex);
                        this.jamaah[idx] = { ...this.formJ };
                    } else {
                        this.jamaah.unshift({ ...this.formJ, id: Date.now() });
                    }
                    this.save();
                    this.showForm = false;
                    this.editingIndex = null;
                },

                editJamaah(id) {
                    const item = this.jamaah.find(i => i.id === id);
                    this.formJ = { ...item };
                    this.editingIndex = id;
                    this.showForm = true;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },

                toggleCair(id) {
                    const idx = this.jamaah.findIndex(i => i.id === id);
                    this.jamaah[idx].status = this.jamaah[idx].status === 'Cair' ? 'Pending' : 'Cair';
                    this.save();
                },

                deleteJamaah(id) {
                    if(confirm('Hapus data ini?')) {
                        this.jamaah = this.jamaah.filter(i => i.id !== id);
                        this.save();
                    }
                },

                // IMPORT & EXPORT LOGIC
                exportCSV() {
                    if (this.jamaah.length === 0) return alert('Tidak ada data untuk diekspor!');
                    const csv = Papa.unparse(this.jamaah);
                    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.setAttribute('download', 'data_jamaah_umroh.csv');
                    link.click();
                },

                importCSV(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    Papa.parse(file, {
                        header: true,
                        skipEmptyLines: true,
                        complete: (results) => {
                            const imported = results.data.map(row => ({
                                id: row.id ? Number(row.id) : Date.now() + Math.random(),
                                paket: row.paket || '',
                                nama: row.nama || '',
                                wa: row.wa || '',
                                tanggal: row.tanggal || new Date().toISOString().split('T')[0],
                                komisi: Number(row.komisi) || 0,
                                pax: Number(row.pax) || 0,
                                status: row.status || 'Pending'
                            }));
                            if (confirm(`Impor ${imported.length} data jamaah?`)) {
                                this.jamaah = [...imported, ...this.jamaah];
                                this.save();
                                alert('Impor Berhasil!');
                            }
                            event.target.value = '';
                        }
                    });
                },

                // PAGINASI & FILTER LOGIC
                filteredJamaahList() {
                    return this.jamaah.filter(item => {
                        if (this.filters.status !== 'all' && item.status !== this.filters.status) return false;
                        const itemDate = new Date(item.tanggal);
                        const now = new Date();
                        const startOfToday = new Date(now.setHours(0,0,0,0));
                        if (this.filters.time === 'today') return itemDate >= startOfToday;
                        if (this.filters.time === 'week') {
                            const startOfWeek = new Date(now.setDate(now.getDate() - now.getDay()));
                            return itemDate >= startOfWeek;
                        }
                        if (this.filters.time === 'month') return itemDate.getMonth() === new Date().getMonth() && itemDate.getFullYear() === new Date().getFullYear();
                        if (this.filters.time === 'year') return itemDate.getFullYear() === new Date().getFullYear();
                        if (this.filters.time === 'custom') {
                            if (!this.filters.start || !this.filters.end) return true;
                            return item.tanggal >= this.filters.start && item.tanggal <= this.filters.end;
                        }
                        return true;
                    });
                },

                paginatedJamaah() {
                    const filtered = this.filteredJamaahList();
                    if (this.itemsPerPage == -1) return filtered;
                    const start = (this.currentPage - 1) * this.itemsPerPage;
                    return filtered.slice(start, start + Number(this.itemsPerPage));
                },

                totalPages() {
                    const filtered = this.filteredJamaahList();
                    if (this.itemsPerPage == -1) return 1;
                    return Math.ceil(filtered.length / this.itemsPerPage) || 1;
                },

                addKas() {
                    this.kas.unshift({ ...this.formK, tanggal: new Date().toLocaleDateString('id-ID') });
                    this.save();
                    this.formK = { kategori: 'Operasional', ket: '', jumlah: 0 };
                },

                deleteKas(index) {
                    if(confirm('Hapus?')) { this.kas.splice(index, 1); this.save(); }
                },

                save() {
                    localStorage.setItem('umroh_db_j', JSON.stringify(this.jamaah));
                    localStorage.setItem('umroh_db_k', JSON.stringify(this.kas));
                },

                totalPax() { return this.filteredJamaahList().reduce((s, i) => s + Number(i.pax), 0); },
                totalKomisi() { return this.filteredJamaahList().reduce((s, i) => s + (i.pax * i.komisi), 0); },
                komisiCair() { return this.filteredJamaahList().filter(i => i.status === 'Cair').reduce((s, i) => s + (i.pax * i.komisi), 0); },
                wajibZakat() { return this.komisiCair() * 0.025; },
                zakatTerbayar() { return this.kas.filter(i => i.kategori === 'Zakat').reduce((s, i) => s + Number(i.jumlah), 0); },
                totalKeluar() { return this.kas.reduce((s, i) => s + Number(i.jumlah), 0); },
                labaBersih() { return this.komisiCair() - this.totalKeluar(); },

                formatIDR(n) {
                    return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n);
                }
            }
        }
    </script>
</body>
</html>
