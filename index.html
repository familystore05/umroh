<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UmrohPro Management - Cloud Version</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        [x-cloak] { display: none !important; }
        .tab-active { background-color: #4f46e5; color: white; box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3); }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body x-data="appData()" x-init="init()" class="antialiased text-slate-900">

    <template x-if="!isLoggedIn">
        <div class="min-h-screen flex items-center justify-center bg-slate-950 p-6">
            <div class="bg-white p-8 rounded-[2rem] w-full max-w-md shadow-2xl">
                <h1 class="text-2xl font-black text-center mb-8 text-slate-800">Umroh<span class="text-indigo-600">Pro</span></h1>
                <form @submit.prevent="login()" class="space-y-4">
                    <input type="text" x-model="loginForm.user" placeholder="Username" class="w-full p-4 bg-slate-50 border rounded-xl outline-none font-bold">
                    <input type="password" x-model="loginForm.pass" placeholder="Password" class="w-full p-4 bg-slate-50 border rounded-xl outline-none font-bold">
                    <button type="submit" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-black uppercase text-xs tracking-widest">Login</button>
                </form>
            </div>
        </div>
    </template>

    <template x-if="isLoggedIn">
        <div class="min-h-screen flex flex-col">
            <header class="bg-white border-b border-slate-200 p-4 md:p-6 flex flex-col md:flex-row justify-between items-center sticky top-0 z-50 gap-4">
                <div class="flex items-center justify-between w-full md:w-auto gap-4">
                    <h2 class="font-black text-xl tracking-tighter">Umroh<span class="text-indigo-600">Pro</span></h2>
                    <nav class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl overflow-x-auto">
                        <button @click="activeTab = 'jamaah'; currentPageJ = 1" :class="activeTab === 'jamaah' ? 'tab-active' : 'text-slate-500'" class="whitespace-nowrap px-4 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest transition-all">Jamaah</button>
                        <button @click="activeTab = 'kas'; currentPageK = 1" :class="activeTab === 'kas' ? 'tab-active' : 'text-slate-500'" class="whitespace-nowrap px-4 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest transition-all">Kas & Zakat</button>
                    </nav>
                </div>
                <button @click="logout()" class="text-rose-600 font-black text-[10px] uppercase tracking-widest px-4 py-2 rounded-xl hover:bg-rose-50 w-full md:w-auto text-center">Keluar</button>
            </header>

            <main class="max-w-7xl mx-auto w-full p-4 md:p-6 flex-1">
                
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                    <div class="bg-white p-6 rounded-3xl border shadow-sm">
                        <p class="text-[10px] font-black text-slate-400 uppercase">Total Jamaah</p>
                        <h3 class="text-2xl font-black" x-text="totalPax() + ' Pax'"></h3>
                    </div>
                    <div class="bg-white p-6 rounded-3xl border shadow-sm">
                        <p class="text-[10px] font-black text-slate-400 uppercase">Total Komisi</p>
                        <h3 class="text-xl font-black text-indigo-600" x-text="formatIDR(totalKomisi())"></h3>
                    </div>
                    <div class="bg-amber-500 p-6 rounded-3xl text-white shadow-lg">
                        <p class="text-[10px] font-black uppercase opacity-80">Zakat Terhutang</p>
                        <h3 class="text-xl font-black" x-text="formatIDR(wajibZakat() - zakatTerbayar())"></h3>
                    </div>
                    <div class="bg-slate-900 p-6 rounded-3xl text-white">
                        <p class="text-[10px] font-black uppercase opacity-80">Laba Bersih</p>
                        <h3 class="text-xl font-black" x-text="formatIDR(labaBersih())"></h3>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-3xl border shadow-sm flex flex-wrap items-center gap-4 mb-6">
                    <div class="flex items-center gap-2 bg-slate-50 px-3 py-2 rounded-xl border w-full md:w-auto">
                        <span class="text-[10px] font-black text-slate-400 uppercase">Periode:</span>
                        <select x-model="filters.time" @change="currentPageJ = 1; currentPageK = 1" class="bg-transparent text-xs font-black outline-none w-full">
                            <option value="all">Semua Waktu</option>
                            <option value="today">Hari Ini</option>
                            <option value="yesterday">Kemarin</option>
                            <option value="7days">7 Hari</option>
                            <option value="30days">30 Hari</option>
                            <option value="month">Bulan Ini</option>
                            <option value="year">Tahun Ini</option>
                            <option value="custom">Custom</option>
                        </select>
                    </div>
                    <template x-if="filters.time === 'custom'">
                        <div class="flex items-center gap-2 w-full md:w-auto">
                            <input type="date" x-model="filters.start" @change="currentPageJ = 1" class="bg-white border p-2 rounded-xl text-xs font-bold w-1/2 md:w-auto">
                            <input type="date" x-model="filters.end" @change="currentPageJ = 1" class="bg-white border p-2 rounded-xl text-xs font-bold w-1/2 md:w-auto">
                        </div>
                    </template>
                </div>

                <div x-show="activeTab === 'jamaah'" class="fade-in space-y-6">
                    <div class="bg-white rounded-[2rem] border shadow-sm overflow-hidden">
                        <div class="p-6 border-b flex justify-between items-center bg-slate-50/50">
                            <h3 class="font-black text-lg">Database Jamaah</h3>
                            <button @click="openAddJamaah()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase" x-text="showFormJ ? 'Batal' : '+ Tambah'"></button>
                        </div>

                        <div x-show="showFormJ" class="p-6 bg-slate-50 border-b">
                            <form @submit.prevent="saveJamaah()" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div class="relative">
                                    <input type="text" x-model="formJ.paket" placeholder="Nama Paket Umroh" list="listPaket" class="w-full p-4 rounded-xl border font-bold outline-none" required>
                                    <datalist id="listPaket">
                                        <template x-for="p in listPaket()" :key="p">
                                            <option :value="p"></option>
                                        </template>
                                    </datalist>
                                </div>
                                <input type="text" x-model="formJ.nama" @input="calcPax()" placeholder="Nama Jamaah (Pisah Koma)" class="p-4 rounded-xl border font-bold" required>
                                <input type="text" x-model="formJ.phone" placeholder="No WhatsApp (Contoh: 0812...)" class="p-4 rounded-xl border font-bold">
                                <input type="date" x-model="formJ.tanggal" class="p-4 rounded-xl border font-bold" required>
                                <div class="relative">
                                    <input type="text" :value="formatInput(formJ.komisi)" @input="formJ.komisi = parseInput($event.target.value)" placeholder="Komisi / Pax" class="w-full p-4 rounded-xl border font-bold" required>
                                    <span class="absolute right-4 top-4 text-[10px] font-black text-slate-400">IDR</span>
                                </div>
                                <div class="p-4 bg-indigo-50 rounded-xl font-black text-indigo-600 flex items-center justify-between">
                                    <span>Total Pax:</span> <span x-text="formJ.pax"></span>
                                </div>
                                <button type="submit" class="bg-slate-900 text-white py-4 rounded-xl font-black uppercase text-xs" x-text="editingIdJ ? 'Update Data' : 'Simpan Data'"></button>
                            </form>
                        </div>

                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs">
                                <thead class="bg-slate-50 text-[10px] font-black text-slate-400 uppercase">
                                    <tr>
                                        <th class="px-6 py-4">Data Jamaah</th>
                                        <th class="px-6 py-4 text-center">Pax</th>
                                        <th class="px-6 py-4 text-right">Komisi</th>
                                        <th class="px-6 py-4 text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y">
                                    <template x-for="j in paginatedJamaah()" :key="j.id">
                                        <tr class="hover:bg-slate-50">
                                            <td class="px-6 py-4">
                                                <p class="font-black text-slate-800" x-text="j.nama"></p>
                                                <p class="text-[10px] text-slate-400 font-bold" x-text="j.paket + ' • ' + j.tanggal"></p>
                                                <template x-if="j.phone">
                                                    <a :href="'https://wa.me/' + formatWA(j.phone)" target="_blank" class="text-[10px] text-emerald-600 font-black flex items-center gap-1 mt-1">
                                                        <span>📞 WhatsApp:</span> <span x-text="j.phone"></span>
                                                    </a>
                                                </template>
                                            </td>
                                            <td class="px-6 py-4 text-center font-bold" x-text="j.pax"></td>
                                            <td class="px-6 py-4 text-right font-black" x-text="formatIDR(j.pax * j.komisi)"></td>
                                            <td class="px-6 py-4 text-center">
                                                <div class="flex gap-3 justify-center">
                                                    <button @click="editJamaah(j)" class="text-indigo-600 font-black">Edit</button>
                                                    <button @click="deleteJamaah(j.id)" class="text-rose-600 font-black">Hapus</button>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                        
                        <div class="p-4 bg-slate-50 border-t flex flex-col md:flex-row items-center justify-between gap-4">
                            <select x-model="perPageJ" @change="currentPageJ = 1" class="bg-white border rounded-lg px-2 py-1 text-xs font-bold outline-none w-full md:w-auto">
                                <option value="5">5 / Halaman</option>
                                <option value="10">10 / Halaman</option>
                                <option value="50">50 / Halaman</option>
                                <option value="100">100 / Halaman</option>
                                <option value="all">Semua Data</option>
                            </select>
                            <div class="flex items-center gap-2" x-show="perPageJ !== 'all'">
                                <button @click="currentPageJ--" :disabled="currentPageJ === 1" class="px-3 py-1 bg-white border rounded-lg disabled:opacity-30 font-bold text-xs">Prev</button>
                                <span class="text-xs font-black" x-text="currentPageJ + '/' + totalPagesJ()"></span>
                                <button @click="currentPageJ++" :disabled="currentPageJ >= totalPagesJ()" class="px-3 py-1 bg-white border rounded-lg disabled:opacity-30 font-bold text-xs">Next</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div x-show="activeTab === 'kas'" class="fade-in grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="bg-white p-6 rounded-[2rem] border shadow-sm h-fit">
                        <h3 class="font-black mb-4">Input Pengeluaran</h3>
                        <form @submit.prevent="addKas()" class="space-y-3">
                            <select x-model="formK.kategori" class="w-full p-4 bg-slate-50 border rounded-xl font-bold">
                                <option value="Operasional">Operasional</option>
                                <option value="Zakat">Zakat Terbayar</option>
                            </select>
                            <input type="text" x-model="formK.ket" placeholder="Keterangan" class="w-full p-4 bg-slate-50 border rounded-xl font-bold" required>
                            <div class="relative">
                                <input type="text" :value="formatInput(formK.jumlah)" @input="formK.jumlah = parseInput($event.target.value)" placeholder="Nominal" class="w-full p-4 bg-slate-50 border rounded-xl font-bold" required>
                                <span class="absolute right-4 top-4 text-[10px] font-black text-slate-400">IDR</span>
                            </div>
                            <button type="submit" class="w-full bg-rose-600 text-white py-4 rounded-xl font-black uppercase text-xs">Simpan</button>
                        </form>
                    </div>

                    <div class="lg:col-span-2 bg-white rounded-[2rem] border shadow-sm overflow-hidden">
                        <div class="p-6 border-b bg-slate-50/50"><h3 class="font-black">Riwayat Transaksi Kas</h3></div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs">
                                <thead class="bg-slate-50 text-[10px] font-black text-slate-400 uppercase">
                                    <tr>
                                        <th class="px-6 py-4">Keterangan</th>
                                        <th class="px-6 py-4 text-right">Nominal</th>
                                        <th class="px-6 py-4 text-center">X</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="k in paginatedKas()" :key="k.id">
                                        <tr class="hover:bg-slate-50 border-b">
                                            <td class="px-6 py-4">
                                                <p class="font-black" x-text="k.ket"></p>
                                                <p class="text-[10px] text-rose-600 font-black uppercase" x-text="k.kategori"></p>
                                            </td>
                                            <td class="px-6 py-4 text-right font-black text-rose-600" x-text="formatIDR(k.jumlah)"></td>
                                            <td class="px-6 py-4 text-center">
                                                <button @click="deleteKas(k.id)" class="text-slate-300 hover:text-rose-600 font-bold text-lg">×</button>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                        <div class="p-4 bg-slate-50 border-t flex items-center justify-between">
                             <select x-model="perPageK" @change="currentPageK = 1" class="bg-white border rounded-lg px-2 py-1 text-xs font-bold outline-none">
                                <option value="5">5</option>
                                <option value="10">10</option>
                                <option value="50">50</option>
                                <option value="all">Semua</option>
                            </select>
                            <div class="flex gap-2" x-show="perPageK !== 'all'">
                                <button @click="currentPageK--" :disabled="currentPageK === 1" class="text-xs font-bold disabled:opacity-20">Prev</button>
                                <button @click="currentPageK++" :disabled="currentPageK >= totalPagesK()" class="text-xs font-bold disabled:opacity-20">Next</button>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </template>

    <script>
        function appData() {
            return {
                isLoggedIn: false,
                activeTab: 'jamaah',
                showFormJ: false,
                editingIdJ: null,
                jamaah: [],
                kas: [],
                client: null,
                currentPageJ: 1, perPageJ: 10,
                currentPageK: 1, perPageK: 10,
                loginForm: { user: '', pass: '' },
                filters: { time: 'all', start: '', end: '' },
                formJ: { paket: '', nama: '', phone: '', tanggal: '', komisi: 0, pax: 0 },
                formK: { kategori: 'Operasional', ket: '', jumlah: 0 },

                async init() {
                    const SB_URL = "https://unjvejcnoydwfgbwzbkk.supabase.co";
                    const SB_KEY = "sb_publishable_zEhLY8Ktm3e2t_hGvjwQ1g_yPaQz1W3";
                    this.client = supabase.createClient(SB_URL, SB_KEY);
                    if (localStorage.getItem('umroh_session')) this.isLoggedIn = true;
                    await this.fetchData();
                },

                async fetchData() {
                    if (!this.client) return;
                    const { data: j } = await this.client.from('jamaah').select('*').order('tanggal', { ascending: false });
                    this.jamaah = j || [];
                    const { data: k } = await this.client.from('kas').select('*').order('id', { ascending: false });
                    this.kas = k || [];
                },

                // AUTOCOMPLETE LOGIC: Ambil daftar paket unik dari data yang sudah ada
                listPaket() {
                    return [...new Set(this.jamaah.map(i => i.paket))].sort();
                },

                login() {
                    if (this.loginForm.user === 'admin' && this.loginForm.pass === '123') {
                        this.isLoggedIn = true;
                        localStorage.setItem('umroh_session', 'true');
                    }
                },
                logout() {
                    this.isLoggedIn = false;
                    localStorage.removeItem('umroh_session');
                },

                formatWA(num) {
                    if(!num) return "";
                    let clean = num.replace(/\D/g, "");
                    if(clean.startsWith("0")) clean = "62" + clean.slice(1);
                    return clean;
                },

                formatInput(val) {
                    if (!val) return "";
                    return val.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
                },
                parseInput(val) {
                    if (typeof val !== 'string') return val;
                    return parseInt(val.replace(/\./g, "")) || 0;
                },
                formatIDR(n) {
                    return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n);
                },

                calcPax() {
                    this.formJ.pax = this.formJ.nama.split(',').filter(n => n.trim() !== '').length;
                },

                openAddJamaah() {
                    this.showFormJ = !this.showFormJ;
                    this.editingIdJ = null;
                    this.formJ = { paket: '', nama: '', phone: '', tanggal: new Date().toISOString().split('T')[0], komisi: 0, pax: 0 };
                },

                async saveJamaah() {
                    if (this.editingIdJ) {
                        await this.client.from('jamaah').update(this.formJ).eq('id', this.editingIdJ);
                    } else {
                        await this.client.from('jamaah').insert([{...this.formJ, id: Date.now()}]);
                    }
                    await this.fetchData();
                    this.openAddJamaah();
                },

                editJamaah(item) {
                    this.formJ = { ...item };
                    this.editingIdJ = item.id;
                    this.showFormJ = true;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },

                async deleteJamaah(id) {
                    if(confirm('Hapus?')) {
                        await this.client.from('jamaah').delete().eq('id', id);
                        await this.fetchData();
                    }
                },

                async addKas() {
                    await this.client.from('kas').insert([{...this.formK, id: Date.now(), tanggal: new Date().toISOString()}]);
                    this.formK = { kategori: 'Operasional', ket: '', jumlah: 0 };
                    await this.fetchData();
                },

                async deleteKas(id) {
                    if(confirm('Hapus?')) {
                        await this.client.from('kas').delete().eq('id', id);
                        await this.fetchData();
                    }
                },

                // FILTER & PAGINATION
                applyFilter(list) {
                    return list.filter(item => {
                        const itemDate = new Date(item.tanggal);
                        itemDate.setHours(0,0,0,0);
                        const now = new Date(); now.setHours(0,0,0,0);

                        if (this.filters.time === 'today') return itemDate.getTime() === now.getTime();
                        if (this.filters.time === 'yesterday') {
                            const y = new Date(now); y.setDate(now.getDate() - 1);
                            return itemDate.getTime() === y.getTime();
                        }
                        if (this.filters.time === '7days') {
                            const l = new Date(now); l.setDate(now.getDate() - 7);
                            return itemDate >= l;
                        }
                        if (this.filters.time === '30days') {
                            const l = new Date(now); l.setDate(now.getDate() - 30);
                            return itemDate >= l;
                        }
                        if (this.filters.time === 'month') return itemDate.getMonth() === now.getMonth() && itemDate.getFullYear() === now.getFullYear();
                        if (this.filters.time === 'year') return itemDate.getFullYear() === now.getFullYear();
                        if (this.filters.time === 'custom') {
                            if (!this.filters.start || !this.filters.end) return true;
                            return itemDate >= new Date(this.filters.start) && itemDate <= new Date(this.filters.end);
                        }
                        return true;
                    });
                },

                filteredJamaah() { return this.applyFilter(this.jamaah); },
                paginatedJamaah() {
                    const f = this.filteredJamaah();
                    if (this.perPageJ === 'all') return f;
                    const limit = parseInt(this.perPageJ);
                    return f.slice((this.currentPageJ - 1) * limit, this.currentPageJ * limit);
                },
                totalPagesJ() { return Math.ceil(this.filteredJamaah().length / parseInt(this.perPageJ)) || 1; },

                filteredKas() { return this.applyFilter(this.kas); },
                paginatedKas() {
                    const f = this.filteredKas();
                    if (this.perPageK === 'all') return f;
                    const limit = parseInt(this.perPageK);
                    return f.slice((this.currentPageK - 1) * limit, this.currentPageK * limit);
                },
                totalPagesK() { return Math.ceil(this.filteredKas().length / parseInt(this.perPageK)) || 1; },

                totalPax() { return this.filteredJamaah().reduce((s, i) => s + Number(i.pax), 0); },
                totalKomisi() { return this.filteredJamaah().reduce((s, i) => s + (i.pax * i.komisi), 0); },
                wajibZakat() { return this.totalKomisi() * 0.025; },
                zakatTerbayar() { return this.filteredKas().filter(i => i.kategori === 'Zakat').reduce((s, i) => s + Number(i.jumlah), 0); },
                totalKeluar() { return this.filteredKas().reduce((s, i) => s + Number(i.jumlah), 0); },
                labaBersih() { return this.totalKomisi() - this.totalKeluar(); }
            }
        }
    </script>
</body>
</html>
